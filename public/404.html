<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      // Single Page App routing fix for GitHub Pages
      // Stores the path in sessionStorage and redirects to index.html
      // which then restores the path for React Router
      const path = window.location.pathname + window.location.search + window.location.hash;
      sessionStorage.setItem('spa-redirect', path);
      window.location.replace('/');
    </script>
  </head>
  <body>
    <noscript>
      <p>Redirecting to <a href="/">home page</a>...</p>
    </noscript>
  </body>
</html>
