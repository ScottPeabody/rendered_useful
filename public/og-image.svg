<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="500" r="200" fill="#6366f1" opacity="0.1"/>
  <circle cx="1050" cy="130" r="150" fill="#a855f7" opacity="0.1"/>
  
  <!-- Main content -->
  <text x="600" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="url(#accent)">rendered_useful</text>
  
  <text x="600" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#a1a1aa">A collaborative platform for developers</text>
  
  <text x="600" y="390" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#a1a1aa">to share projects, articles, and ideas.</text>
  
  <!-- Tags -->
  <rect x="380" y="450" width="100" height="36" rx="18" fill="#6366f1" opacity="0.2"/>
  <text x="430" y="475" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#818cf8">Projects</text>
  
  <rect x="500" y="450" width="100" height="36" rx="18" fill="#a855f7" opacity="0.2"/>
  <text x="550" y="475" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#c084fc">Articles</text>
  
  <rect x="620" y="450" width="120" height="36" rx="18" fill="#ec4899" opacity="0.2"/>
  <text x="680" y="475" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#f472b6">Community</text>
  
  <!-- URL -->
  <text x="600" y="570" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#71717a">rendereduseful.com</text>
</svg>
